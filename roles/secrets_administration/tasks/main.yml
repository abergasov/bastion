---
- name: Create protected persistent server-secret storage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/bastion
    - /var/lib/bastion/secrets
    - /usr/local/libexec

- name: Load controller-side Bastion server Vault
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../{{ vault_secrets_file }}"
    name: bastion_server_vault
  no_log: true

- name: Check for controller-side VPN server Vault
  ansible.builtin.set_fact:
    bastion_vpn_vault_file: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../secrets/vpn-server.yaml') }}"
  changed_when: false
  no_log: true

- name: Load controller-side VPN server Vault
  ansible.builtin.include_vars:
    file: "{{ bastion_vpn_vault_file }}"
    name: bastion_vpn_server_vault
  no_log: true
  when: bastion_vpn_vault_file | length > 0

- name: Deliver required persistent server secrets
  ansible.builtin.copy:
    content: "{{ bastion_server_vault[item.source] }}\n"
    dest: "/var/lib/bastion/secrets/{{ item.destination }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - { source: admin-password-hash, destination: admin-password-hash }
    - { source: root-password-hash, destination: root-password-hash }
    - { source: ssh-notify-config, destination: ssh-notify.conf }
  no_log: true
  diff: false
  notify: Restart Bastion secrets
  register: bastion_required_secret_delivery

- name: Deliver persistent VPN server keys when lifecycle state exists
  ansible.builtin.copy:
    content: "{{ bastion_vpn_server_vault[item.source] }}\n"
    dest: "/var/lib/bastion/secrets/{{ item.destination }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - { source: openvpn-server-key, destination: openvpn-server-key }
    - { source: wireguard-server-key, destination: wireguard-server-key }
  no_log: true
  diff: false
  notify: Restart Bastion secrets
  when: bastion_vpn_vault_file | length > 0
  register: bastion_vpn_secret_delivery

- name: Record whether runtime secret activation changed server material
  ansible.builtin.set_fact:
    bastion_secrets_changed: >-
      {{ (bastion_required_secret_delivery.changed | default(false)) or
         (bastion_vpn_secret_delivery.changed | default(false)) }}
  no_log: true

- name: Install runtime secrets activator
  ansible.builtin.template:
    src: bastion-decrypt-secrets.sh.j2
    dest: /usr/local/libexec/bastion-decrypt-secrets
    owner: root
    group: root
    mode: '0700'
  notify: Restart Bastion secrets

- name: Install runtime secrets systemd unit
  ansible.builtin.template:
    src: bastion-secrets.service.j2
    dest: /etc/systemd/system/bastion-secrets.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Bastion secrets

# sshd reads no runtime secret; a hard dependency would stop SSH whenever activation fails.
- name: Remove the obsolete SSH dependency on runtime secrets
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d/bastion-secrets.conf
    state: absent

- name: Enable and start runtime secrets
  ansible.builtin.systemd_service:
    name: bastion-secrets.service
    enabled: true
    state: started
    daemon_reload: true
  no_log: true
  diff: false

- name: Require refreshed runtime secrets before dependent administration
  ansible.builtin.meta: flush_handlers

- name: Remove obsolete VPS ciphertext and age identity after Vault activation
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/bastion/secrets/server.yaml
    - /var/lib/bastion/secrets/vpn-server.yaml
    - /var/lib/bastion/age/identity.txt
    - /var/lib/bastion/age
  no_log: true
  diff: false
