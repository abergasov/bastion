---
- name: Apply VPN sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Validate and restart OpenVPN
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/bastion-vpn-verify-state
      - /run/bastion-vpn/active
  register: vpn_openvpn_state
  changed_when: false
  failed_when: false

- name: Restart OpenVPN after validated configuration change
  listen: Validate and restart OpenVPN
  ansible.builtin.systemd_service:
    name: openvpn-server@bastion.service
    state: restarted
  when: vpn_openvpn_state.rc == 0
