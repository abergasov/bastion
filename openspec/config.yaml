schema: spec-driven

context: |
  Bastion configures a private Ubuntu Server VPN through Ansible. Communicate with the owner in Russian.
  Read openspec/README.md and the relevant openspec/specs/<capability>/spec.md files.
  The specs are target requirements migrated from AGENTS.md, not implemented behavior.
  Retained NixOS code and archived verification are historical, not Ubuntu/Ansible evidence.
  The read-only source is /home/alejandro/go/src/ansible; needed secrets may be copied securely during implementation.
  Design proposals and unresolved choices live in openspec/notes/design-and-open-questions.md.
  Historical research lives in openspec/notes/research.md; recheck it before implementation.
  Follow AGENTS.md for tools, workflow, authorization and secret-handling rules.
  The current scope is documentation; implementation and deployment require a new request.

rules:
  specs:
    - Keep confirmed requirements distinct from proposals and unresolved choices.
    - Give each requirement at least one observable WHEN/THEN scenario.
    - Do not claim that a specified capability is already implemented or verified.
  design:
    - Resolve choices relevant to the change with the owner; do not silently select proposals.
    - Prefer the smallest readable solution using Ansible modules, native Ubuntu services and existing tools.
  tasks:
    - Include focused regression and integration checks appropriate to the changed behavior.
    - Keep implementation, verification and deployment status explicit; report unrun checks.
