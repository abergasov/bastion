---
- name: Bootstrap the Ubuntu platform
  hosts: bootstrap
  remote_user: "{{ ansible_user }}"
  become: true
  become_method: ansible.builtin.sudo
  gather_facts: true
  roles:
    - platform
    - secrets_administration
    - administration
    - firewall
    - ssh_notifications
    - vpn
  post_tasks:
    - name: Finish role handlers before rotating root password
      ansible.builtin.meta: flush_handlers

    - name: Rotate root password after all bootstrap roles
      ansible.builtin.import_role:
        name: administration
        tasks_from: root-password
