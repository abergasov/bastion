---
- name: Apply routine Bastion platform configuration
  hosts: bastion_admin
  remote_user: admin
  become: true
  become_method: ansible.builtin.su
  gather_facts: true
  pre_tasks:
    - name: Prove the fresh routine connection is admin
      ansible.builtin.command: id -un
      register: site_connection_user
      changed_when: false
      check_mode: false
      become: false

    - name: Require the fresh routine connection to be admin
      ansible.builtin.assert:
        that: site_connection_user.stdout == 'admin'
  roles:
    - platform
    - secrets_administration
    - administration
    - firewall
    - ssh_notifications
    - vpn
  post_tasks:
    - name: Finish role handlers before rotating root password
      ansible.builtin.meta: flush_handlers

    - name: Rotate root password after all routine roles
      ansible.builtin.import_role:
        name: administration
        tasks_from: root-password
